# ──────────────────────────────────────────────────────────────────────────────
# Controller Manager
# ──────────────────────────────────────────────────────────────────────────────
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    deltaflex_position_controller:
      type: forward_command_controller/ForwardCommandController

# ──────────────────────────────────────────────────────────────────────────────
# Joint State Broadcaster
# Publishes /joint_states (sensor_msgs/JointState)
# Required by robot_state_publisher and RViz2.
# ──────────────────────────────────────────────────────────────────────────────
joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3

# ──────────────────────────────────────────────────────────────────────────────
# Forward Command Controller
#
# Subscribes: /deltaflex_position_controller/commands
#             (std_msgs/msg/Float64MultiArray, data=[θ1, θ2, θ3] in radians)
#
# ForwardCommandController passes commands directly to the position
# command interfaces without any trajectory interpolation — the
# Cartesian controller node handles all path planning.
# ──────────────────────────────────────────────────────────────────────────────
deltaflex_position_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
    interface_name: position
